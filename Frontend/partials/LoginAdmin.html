<section class="login-admin-page">

  <header class="login-admin-header">
    <div class="login-admin-logos">
      <img src="../assets/Logos/Logo1.jpeg" alt="Logo FMJ">
      <h1>Federación Metropolitana de Judo</h1>
      <img src="../assets/Logos/BuenosAires.png" alt="Logo Buenos Aires">
    </div>

    <div>
      <a href="#/home" class="volver-inicio">Volver al inicio</a>
    </div>
  </header>

  <main class="login-admin-main">
    <h2>Acceso Administrador</h2>

    <form id="formAdmin">
      <div>
        <label for="email">Email</label>
        <input 
          type="email"
          id="email"
          name="email"
          required
        >
      </div>

      <div>
        <label for="password">Contraseña</label>
        <input 
          type="password"
          id="password"
          name="password"
          required
        >
      </div>

      <button type="submit">
        Ingresar
      </button>

      <p id="errorLogin"></p>
    </form>
  </main>

</section>
