<section class="calendar-wrapper">

  <!-- ================= CALENDARIO ================= -->
  <section class="calendar-container">

    <!-- CONTROLES -->
    <div class="calendar-controls">
      <button id="prevMonth">◀</button>
      <h2 id="monthYear"></h2>
      <button id="nextMonth">▶</button>
    </div>

    <!-- DIAS -->
    <div class="weekdays">
      <div>Lun</div>
      <div>Mar</div>
      <div>Mié</div>
      <div>Jue</div>
      <div>Vie</div>
      <div>Sáb</div>
      <div>Dom</div>
    </div>

    <!-- CALENDARIO -->
    <div id="calendarDays" class="days"></div>

  </section>

  <!-- ================= LEYENDA ================= -->
  <aside class="calendar-legend">

    <h3>Referencias</h3>

    <div class="legend-item">
      <span class="legend-color red"></span>
      <span>Torneos realizados</span>
    </div>

    <div class="legend-item">
      <span class="legend-color green"></span>
      <span>Torneos próximos</span>
    </div>

  </aside>

</section>

<!-- =========================
     MODAL DETALLE TORNEO
========================= -->
<div id="eventModal" class="torneo-modal-overlay hidden">

  <div class="torneo-modal">

    <!-- CERRAR -->
    <span id="closeModal" class="close-modal">
      ✖
    </span>

    <!-- IMAGEN -->
    <img
      id="eventImage"
      class="torneo-image"
      src=""
      alt="Imagen torneo"
      style="display: none;"
    >

    <!-- TITULO -->
    <h2 id="eventTitle"></h2>

    <!-- INFO -->
    <div class="torneo-info">

      <div class="info-item">
        <strong>📅 Fecha:</strong>
        <span id="eventFecha"></span>
      </div>

      <div class="info-item">
        <strong>📍 Lugar:</strong>
        <span id="eventDireccion"></span>
      </div>

      <div class="info-item">
        <strong>🥋 Categorías:</strong>
        <span id="eventCategorias"></span>
      </div>

    </div>

  </div>

</div>
