      target="_blank"

      class="calendar-btn google-btn"

    </a>

    <a

    <!-- CALENDARIO -->
    <section class="calendar-container">

      <div class="calendar-controls">
        <button id="prevMonth">◀</button>
        <h2 id="monthYear"></h2>
        <button id="nextMonth">▶</button>
      </div>

      <div class="weekdays">
        <div>Lun</div>
        <div>Mar</div>
        <div>Mié</div>
        <div>Jue</div>
        <div>Vie</div>
        <div>Sáb</div>
        <div>Dom</div>
      </div>

      <div id="calendarDays" class="days"></div>

    </section>
</div>

<!-- =========================
     MODAL DETALLE TORNEO
========================= -->
<div id="eventModal" class="torneo-modal-overlay hidden">

  <div class="torneo-modal">

    <span id="closeModal" class="close-modal">
      ✖
    </span>

    <img
      id="eventImage"
      class="torneo-image"
      src=""
      alt="Imagen torneo"
      style="display: none;"
    >

    <h2 id="eventTitle"></h2>

    <div class="torneo-info">

      <div class="info-item">
        <strong>📅 Fecha:</strong>
        <span id="eventFecha"></span>
      </div>

      <div class="info-item">
        <strong>📍 Lugar:</strong>
        <span id="eventDireccion"></span>
      </div>

      <div class="info-item">
        <strong>🥋 Categorías:</strong>
        <span id="eventCategorias"></span>
      </div>

    </div>

  </div>

</div>
