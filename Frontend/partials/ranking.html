<section class="contenido container my-5">

  <!-- HEADER -->
  <header class="text-center mb-5">
    <span class="badge bg-danger-subtle text-danger mb-3 px-3 py-2">
      Ranking competitivo
    </span>

    <h2 class="fw-bold mb-2">
      Ranking Oficial
    </h2>

    <p class="text-muted mb-0">
      Consultá la posición, categoría y puntaje actual de cada judoka.
    </p>

  </header>

  <!-- LAYOUT RANKING -->
  <section class="ranking-layout">

    <div class="ranking-main">

      <!-- FILTROS SUPERIORES -->
      <section class="ranking-filters shadow-sm mb-4">
        <div class="row g-3 align-items-end">

          <div class="col-12 col-lg-4">
            <label for="filtroCategoria" class="form-label fw-semibold">
              Categoría
            </label>

            <select id="filtroCategoria" class="form-select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="col-12 col-lg-5">
            <label for="searchInput" class="form-label fw-semibold">
              Buscar por nombre o DNI
            </label>

            <input
              type="text"
              id="searchInput"
              class="form-control"
              placeholder="Ej: Gómez, Juan, 12345678..."
            >
          </div>

          <div class="col-12 col-lg-3">
            <label class="form-label fw-semibold">
              Orden
            </label>

            <div class="d-flex gap-2">
              <button id="sortDesc" class="btn btn-danger flex-fill" type="button">
                Mayor
              </button>

              <button id="sortAsc" class="btn btn-outline-danger flex-fill" type="button">
                Menor
              </button>
            </div>
          </div>

        </div>
      </section>

      <!-- TABLA RANKING -->
      <section class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-0">

          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 p-4 border-bottom">
            <div>
              <h5 class="fw-bold mb-1">
                Listado de judokas
              </h5>

              <p class="text-muted mb-0">
                Ranking actualizado según los puntos cargados.
              </p>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover text-center align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>Posición</th>
                  <th>Foto</th>
                  <th>Judoka</th>
                  <th>Categoría</th>
                  <th>Institución</th>
                  <th>Abierto Ciudad 2025</th>
                  <th>Metropolitano 2025</th>
                  <th>Puntaje Total</th>
                </tr>
              </thead>

              <tbody id="rankingBody">
                <tr>
                  <td colspan="8" class="py-4 text-muted">
                    Cargando ranking...
                  </td>
                </tr>
              </tbody>

            </table>
          </div>

        </div>
      </section>

    </div>

  </section>

</section>
