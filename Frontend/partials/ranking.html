<section class="contenido container mt-5">

  <h2 class="text-center mb-1">Ranking Oficial</h2>

  <p class="text-center mb-4">
    Para información avanzada sobre gestión de torneos, 
    <a href="../partials/sistema.html" class="link-sistema">
      consultá el sistema oficial
    </a>.
  </p>

  <div class="row mb-4 align-items-center">
    <div class="col-md-6 mb-2">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Buscar judoka por nombre o DNI..."
      >
    </div>

    <div class="col-md-6 mb-2 text-md-end">
      <button id="sortDesc" class="btn btn-danger me-2">
        Mayor puntaje
      </button>
      <button id="sortAsc" class="btn btn-outline-danger">
        Menor puntaje
      </button>
    </div>
  </div>

  <div class="row">

    <div class="col-lg-3 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white text-center">
          Sistema de Puntajes
        </div>

        <div class="card-body p-0">
          <table class="table table-bordered mb-0 text-center">
            <thead class="table-light">
              <tr>
                <th>Puesto</th>
                <th>Puntos</th>
              </tr>
            </thead>

            <tbody>
              <tr><td>1°</td><td>400 pts</td></tr>
              <tr><td>2°</td><td>300 pts</td></tr>
              <tr><td>3°</td><td>200 pts</td></tr>
              <tr><td>Participación</td><td>100 pts</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="table-responsive">
        <table class="table table-striped table-bordered text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>Posición</th>
              <th>Foto</th>
              <th>Judoka</th>
              <th>Categoría</th>
              <th>Peso</th>
              <th>Puntos</th>
            </tr>
          </thead>

          <tbody id="rankingBody">
            <tr>
              <td colspan="6">Cargando ranking...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

</section>
