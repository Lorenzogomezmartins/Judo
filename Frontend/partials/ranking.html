<section class="contenido container mt-5">

  <h2 class="text-center mb-4">Ranking Oficial</h2>

  <!-- CONTROLES -->
  <div class="row mb-4 align-items-center">
    
    <!-- BUSCADOR -->
    <div class="col-md-6 mb-2">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Buscar judoka por nombre..."
      >
    </div>

    <!-- ORDENAR -->
    <div class="col-md-6 mb-2 text-md-end">
      <button id="sortDesc" class="btn btn-danger me-2">
        Mayor puntaje
      </button>
      <button id="sortAsc" class="btn btn-outline-danger">
        Menor puntaje
      </button>
    </div>

  </div>

  <!-- CONTENIDO -->
  <div class="row">

    <!-- SISTEMA DE PUNTAJES (IZQUIERDA) -->
    <div class="col-lg-3 mb-4">
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white text-center">
          Sistema de Puntajes
        </div>
        <div class="card-body p-0">
          <table class="table table-bordered mb-0 text-center">
            <thead class="table-light">
              <tr>
                <th>Puesto</th>
                <th>Puntos</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td>1°</td>
                <td>400 pts</td>
              </tr>
              <tr>
                <td>2°</td>
                <td>300 pts</td>
              </tr>
              <tr>
                <td>3°</td>
                <td>200 pts</td>
              </tr>
              <tr>
                <td>Participación</td>
                <td>100 pts</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- TABLA RANKING (DERECHA) -->
    <div class="col-lg-9">
      <div class="table-responsive">
        <table class="table table-striped table-bordered text-center align-middle">
          <thead class="table-dark">
            <tr>
              <th>Posición</th>
              <th>Judoka</th>
              <th>Club</th>
              <th>Puntos</th>
            </tr>
          </thead>
          <tbody id="rankingBody">
            <tr>
              <td>1</td>
              <td>Juan Pérez</td>
              <td>Club Central</td>
              <td data-points="1200">1200</td>
            </tr>
            <tr>
              <td>2</td>
              <td>Martín Gómez</td>
              <td>Dojo Norte</td>
              <td data-points="1050">1050</td>
            </tr>
            <tr>
              <td>3</td>
              <td>Lucas Fernández</td>
              <td>Judo Sur</td>
              <td data-points="980">980</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

</section>
