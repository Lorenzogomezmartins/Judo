<section class="contenido container my-5 torneos-page">

  <header class="torneos-header text-center mb-5">
    <span class="badge bg-danger-subtle text-danger mb-3 px-3 py-2">
      Actividades FMJ
    </span>

    <h2 class="fw-bold mb-2">Torneos, cursos y eventos</h2>

    <p class="text-muted mb-0">
      Consultá torneos, cursos, capacitaciones, eventos, transmisiones y resultados oficiales.
    </p>
  </header>

  <!-- CARRUSEL -->
  <section class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1" id="tituloCarouselTorneos">
          Torneos destacados
        </h4>

        <p class="text-muted mb-0" id="descripcionCarouselTorneos">
          Competencias cargadas en el sistema.
        </p>
      </div>
    </div>

    <div
      id="carouselTorneos"
      class="carousel slide shadow rounded-4 overflow-hidden"
      data-bs-ride="carousel"
    >
      <div id="carouselTorneosInner" class="carousel-inner">
        <div class="carousel-item active">
          <div class="alert alert-info text-center m-0">
            Cargando carrusel...
          </div>
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

  <!-- BUSCADOR -->
  <section class="row justify-content-center mb-4">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="input-group input-group-lg shadow-sm">
        <span class="input-group-text bg-white">
          🔎
        </span>

        <input
          type="text"
          id="buscadorTorneosActuales"
          class="form-control"
          placeholder="Buscar por nombre, lugar o categoría..."
        />
      </div>
    </div>
  </section>

  <!-- FILTROS POR TIPO -->
  <section class="mb-5">
    <div class="d-flex justify-content-center gap-2 flex-wrap">

      <button
        class="btn btn-danger filtro-tipo-btn active"
        type="button"
        data-tipo="torneo"
      >
        Torneos
      </button>

      <button
        class="btn btn-outline-danger filtro-tipo-btn"
        type="button"
        data-tipo="curso"
      >
        Cursos
      </button>

      <button
        class="btn btn-outline-danger filtro-tipo-btn"
        type="button"
        data-tipo="capacitacion"
      >
        Capacitaciones
      </button>

      <button
        class="btn btn-outline-danger filtro-tipo-btn"
        type="button"
        data-tipo="evento"
      >
        Eventos
      </button>

    </div>
  </section>

  <!-- CARDS -->
  <section>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1" id="tituloListadoTorneos">
          Torneos
        </h4>

        <p class="text-muted mb-0" id="descripcionListadoTorneos">
          Listado completo de torneos disponibles y finalizados.
        </p>
      </div>
    </div>

    <div id="listaTorneosActuales" class="row g-4">
      <!-- Cards dinámicas -->
    </div>
  </section>

</section>
