<section class="contenido container my-5 torneos-page">

  <header class="torneos-header text-center mb-5">
    <span class="badge bg-danger-subtle text-danger mb-3 px-3 py-2">
      Competencias FMJ
    </span>

    <h2 class="fw-bold mb-2">Torneos</h2>

    <p class="text-muted mb-0">
      Consultá los torneos cargados y sus resultados oficiales publicados desde JudoShiai.
    </p>
  </header>

  <section class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Torneos destacados</h4>
        <p class="text-muted mb-0">Competencias cargadas en el sistema.</p>
      </div>

      <div class="d-flex gap-2 flex-wrap">
        <a href="#/torneos-actuales" class="btn btn-danger">
          Ver disponibles
        </a>

        <a href="#/torneos-anteriores" class="btn btn-outline-danger">
          Ver finalizados
        </a>
      </div>
    </div>

    <div
      id="carouselTorneos"
      class="carousel slide shadow rounded-4 overflow-hidden"
      data-bs-ride="carousel"
    >
      <div id="carouselTorneosInner" class="carousel-inner">
        <div class="carousel-item active">
          <div class="alert alert-info text-center m-0">
            Cargando carrusel...
          </div>
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>
