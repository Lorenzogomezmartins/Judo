<section class="contenido container my-5 torneos-page">

  <header class="torneos-header text-center mb-5">
    <span class="badge bg-danger-subtle text-danger mb-3 px-3 py-2">
      Competencias FMJ
    </span>

    <h2 class="fw-bold mb-2">Torneos</h2>

    <p class="text-muted mb-0">
      Consultá todos los torneos cargados y sus resultados oficiales publicados desde JudoShiai.
    </p>
  </header>

  <!-- CARRUSEL -->
  <section class="mb-5">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Torneos destacados</h4>
        <p class="text-muted mb-0">Competencias cargadas en el sistema.</p>
      </div>
    </div>

    <div
      id="carouselTorneos"
      class="carousel slide shadow rounded-4 overflow-hidden"
      data-bs-ride="carousel"
    >
      <div id="carouselTorneosInner" class="carousel-inner">
        <div class="carousel-item active">
          <div class="alert alert-info text-center m-0">
            Cargando carrusel...
          </div>
        </div>
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

  <!-- BUSCADOR -->
  <section class="row justify-content-center mb-5">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="input-group input-group-lg shadow-sm">
        <span class="input-group-text bg-white">
          🔎
        </span>

        <input
          type="text"
          id="buscadorTorneosActuales"
          class="form-control"
          placeholder="Buscar torneo por nombre, lugar o categoría..."
        />
      </div>
    </div>
  </section>

  <!-- CARDS DE TODOS LOS TORNEOS -->
  <section>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
      <div>
        <h4 class="fw-bold mb-1">Todos los torneos</h4>
        <p class="text-muted mb-0">
          Listado completo de torneos disponibles y finalizados.
        </p>
      </div>
    </div>

    <div id="listaTorneosActuales" class="row g-4">
      <!-- Cards dinámicas -->
    </div>
  </section>

</section>
