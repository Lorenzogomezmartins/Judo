<section class="contenido container mt-5">
  <a href="#/torneos" class="btn btn-outline-secondary mb-4">
    ← Volver a Torneos
  </a>
  <h2 class="text-center mb-4">Torneos Finalizados</h2>

  <!-- BUSCADOR -->
  <div class="row justify-content-center mb-5">
    <div class="col-md-6">
      <input
        type="text"
        class="form-control form-control-lg"
        placeholder="Buscar torneo por nombre, año o sede..."
      >
    </div>
  </div>

  <!-- CARRUSEL -->
  <section class="carousel-container">

    <h4 class="text-center mb-3">Últimos Torneos Realizados</h4>

    <div id="carouselTorneos" class="carousel slide shadow" data-bs-ride="carousel">
      <div class="carousel-inner">

        <div class="carousel-item active">
          <img src="../imagenes/torneo1.jpg" class="d-block w-100" alt="Copa Metropolitana 2025">
          <div class="carousel-caption bg-dark bg-opacity-75 rounded p-2">
            <h5>Copa Metropolitana 2025</h5>
            <p>12/10/2025 · Estadio Central</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="../imagenes/torneo2.jpg" class="d-block w-100" alt="Open FMJ 2025">
          <div class="carousel-caption bg-dark bg-opacity-75 rounded p-2">
            <h5>Open FMJ 2025</h5>
            <p>05/08/2025 · Polideportivo Norte</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="../imagenes/torneo3.jpg" class="d-block w-100" alt="Copa Juvenil FMJ">
          <div class="carousel-caption bg-dark bg-opacity-75 rounded p-2">
            <h5>Copa Juvenil FMJ</h5>
            <p>20/06/2025 · Club Judo Sur</p>
          </div>
        </div>

      </div>

      <button class="carousel-control-prev" type="button"
        data-bs-target="#carouselTorneos" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button"
        data-bs-target="#carouselTorneos" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>

  </section>

</section>
