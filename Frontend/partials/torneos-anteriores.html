<section class="contenido container mt-5">
  <a href="#/torneos" class="btn btn-outline-secondary mb-4">
    ← Volver a Torneos
  </a>

  <h2 class="text-center mb-4">Torneos Finalizados</h2>

  <!-- BUSCADOR -->
  <div class="row justify-content-center mb-5">
    <div class="col-md-6">
      <input
        type="text"
        id="buscadorTorneosAnteriores"
        class="form-control form-control-lg"
        placeholder="Buscar torneo por nombre, año o sede..."
      />
    </div>
  </div>

  <!-- CARRUSEL -->
  <section class="carousel-container mb-5">
    <h4 class="text-center mb-3">Últimos Torneos Realizados</h4>

    <div id="carouselTorneos" class="carousel slide shadow" data-bs-ride="carousel">
      <div id="carouselTorneosInner" class="carousel-inner">
        <!-- Acá se insertan los slides dinámicamente -->
      </div>

      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselTorneos"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </section>

  <!-- LISTADO -->
  <div id="listaTorneosAnteriores" class="row g-4">
    <!-- Acá se insertan las cards dinámicamente -->
  </div>
</section>
